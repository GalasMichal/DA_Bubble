@if(this.userList){
  <div class="user-avatar">
    <div class="pre-loader-small"></div>
    <img class="avatar" [src]="avatarSrc(user.avatarUrl)" (error)="onAvatarError($event)" alt="avatar">
    @if(user.status) {
      <img class="online" src="/assets/media/icons/online.svg" alt="online">
    }@else {
      <img class="online" src="/assets/media/icons/offline.svg" alt="offline">}
</div>

}@else if (userMessageReceiver) {
  <div class="user-avatar">
    <div class="pre-loader-small"></div>
    <img [src]="avatarSrc(userMessageReceiver.avatarUrl)" (error)="onAvatarError($event)" alt="avatar">
    <img class="online" src="/assets/media/icons/online.svg" alt="online">
</div>
}

@else {

  <div class="user-avatar">
    <div class="pre-loader-small"></div>
    <img [src]="avatarSrc(db.currentUser()?.avatarUrl)" (error)="onAvatarError($event)" alt="avatar">
    <img class="online" src="/assets/media/icons/online.svg" alt="online">
</div>
}
